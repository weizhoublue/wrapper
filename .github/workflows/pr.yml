name: PR Test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:bundle && npm run build:patch && npx @yao-pkg/pkg dist/wrapper-bundle.js --targets node18-linux-x64 --output dist/wrapper
